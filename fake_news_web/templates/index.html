<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .confidence {
            margin-top: 8px;
            text-align: center;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Fake News Detector</h2>

    <textarea id="newsText" placeholder="Paste the news article here..."></textarea>

    <button onclick="verifyNews()">Verify</button>

    <div class="result" id="result"></div>
    <div class="confidence" id="confidence"></div>
</div>

<script>
function verifyNews() {
    const text = document.getElementById("newsText").value;

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "news=" + encodeURIComponent(text)
    })
    .then(response => response.json())
    .then(data => {
        const resultDiv = document.getElementById("result");
        const confidenceDiv = document.getElementById("confidence");

        resultDiv.innerHTML = data.result;
        confidenceDiv.innerHTML = "Confidence: " + data.confidence + "%";

        // Color coding
        if (data.result.includes("TRUE")) {
            resultDiv.style.color = "green";
        } else if (data.result.includes("FAKE")) {
            resultDiv.style.color = "red";
        } else {
            resultDiv.style.color = "black";
        }
    });
}
</script>

</body>
</html>
